[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cantill-spend-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
cantill-pipeline = "cantill_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
